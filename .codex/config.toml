# The Langfuse tracing plugin is installed globally, but is enabled only for
# Codex sessions started from this trusted repository root.
[features]
plugin_hooks = true

[plugins."tracing@codex-observability-plugin"]
enabled = true

[plugins."rcore-session-archive@rcore-tutorial-2025s"]
enabled = true

# Hook trust is reviewed and stored on each student's machine via /hooks.
